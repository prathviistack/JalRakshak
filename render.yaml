services:
  # --- Backend API ---
  - type: web
    runtime: node
    name: jalrakshak-api
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # set this to your MongoDB Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://jalrakshak-client.onrender.com # update if your static site gets a different name
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: WEATHER_API_BASE_URL
        value: https://api.openweathermap.org/data/2.5

  # --- Frontend static site ---
  - type: web
    runtime: static
    name: jalrakshak-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://jalrakshak-api.onrender.com/api # update if your API service gets a different name
      - key: VITE_SOCKET_URL
        value: https://jalrakshak-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html # SPA fallback so React Router handles client-side routes
